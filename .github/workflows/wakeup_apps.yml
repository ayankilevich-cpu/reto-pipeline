name: Despertar apps (Streamlit Cloud + HF Space)

on:
  schedule:
    # Cada 3h en UTC, sin gate de temporada. GitHub Actions demora los cron
    # scheduled hasta varias horas en el plan gratuito (confirmado: corridas
    # que deberían disparar a las 6:30/7:30 Madrid terminaron ejecutándose
    # recién al mediodía). Con un solo disparo diario, esos atrasos dejaban
    # huecos más largos que las 12h de sleep de Streamlit Cloud. 8 disparos
    # nominales por día dan margen aunque cada uno individualmente llegue tarde.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}     # permite disparo manual para probar

jobs:
  wakeup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (script Playwright)
        uses: actions/checkout@v4

      - name: Despertar Hugging Face Space (ping simple)
        run: |
          # Subdominio directo del Space (proceso real); el wrapper de HF
          # puede devolver 200 sin despertar Streamlit.
          curl -sSL -o /dev/null -w "HF Space (.hf.space): %{http_code}\n" \
            "https://aleyanki13-proyectoreto.hf.space" \
            --max-time 60 --retry 2 --retry-delay 10 || true
          curl -sSL -o /dev/null -w "HF Space (página HF): %{http_code}\n" \
            "https://huggingface.co/spaces/aleyanki13/proyectoreto" \
            --max-time 60 --retry 2 --retry-delay 10 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Despertar Streamlit Cloud (click en botón si aparece)
        run: python .github/scripts/wakeup_streamlit.py
