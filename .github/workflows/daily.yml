# ReTo Pipeline — Ejecución diaria automatizada
# ================================================
# Scheduler: 09:00 UTC = 10:00 España (CET invierno) / 11:00 (CEST verano).
# GitHub Actions corre en servidores cloud — el Mac NO necesita estar encendido.
#
# Ejecución manual: GitHub > Actions > ReTo Pipeline Diario > Run workflow
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, DB_SSLMODE
#   OPENAI_API_KEY
#   YOUTUBE_API_KEY
#   RETO_SALT
#   GOOGLE_DRIVE_CREDENTIALS_B64   (Service Account JSON en base64)
#   GOOGLE_DRIVE_FOLDER_ID
#
# Nota sobre etiquetar_completo_llm.py:
#   Corre LOCALMENTE (no en Actions) para controlar costos de OpenAI.
#   Los resultados quedan en CSVs locales y suben a la BD vía load_to_db.py
#   en la siguiente ejecución del pipeline.

name: ReTo Pipeline Diario

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DB_HOST:                      ${{ secrets.DB_HOST }}
      DB_PORT:                      ${{ secrets.DB_PORT }}
      DB_NAME:                      ${{ secrets.DB_NAME }}
      DB_USER:                      ${{ secrets.DB_USER }}
      DB_PASSWORD:                  ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE:                   ${{ secrets.DB_SSLMODE }}
      OPENAI_API_KEY:               ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY:              ${{ secrets.YOUTUBE_API_KEY }}
      RETO_SALT:                    ${{ secrets.RETO_SALT }}
      GOOGLE_DRIVE_FOLDER_ID:       ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_CREDENTIALS_B64: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_B64 }}
      PROJECT_ROOT:                 ${{ github.workspace }}

    steps:
      # ── Setup ───────────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar credenciales de Google Drive
        if: ${{ env.GOOGLE_DRIVE_CREDENTIALS_B64 != '' }}
        run: |
          echo "$GOOGLE_DRIVE_CREDENTIALS_B64" | base64 -d > credentials.json
          echo "GOOGLE_DRIVE_CREDENTIALS=credentials.json" >> $GITHUB_ENV

      - name: Crear directorios de datos
        run: |
          mkdir -p X_Mensajes/data/raw
          mkdir -p X_Mensajes/data/master
          mkdir -p X_Mensajes/Anon
          mkdir -p Medios/ML/etiquetado_llm/outputs
          mkdir -p outputs/pipeline_unificado/x
          mkdir -p outputs/pipeline_unificado/youtube

      - name: Restaurar caché de estado anterior
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            Medios/ML/etiquetado_llm/outputs
            Medios/youtube_extract_state.json
            Medios/youtube_hatemedia_comments_30d.csv
            X_Mensajes/data/raw/.drive_sync_state.json
            X_Mensajes/data/raw/*.csv
            X_Mensajes/data/master/*.csv
            outputs/pipeline_unificado
          key: reto-pipeline-data-${{ github.run_number }}
          restore-keys: |
            reto-pipeline-data-

      - name: Validar secrets críticos
        run: |
          set -euo pipefail
          [[ -n "${DB_HOST}" ]]                      || { echo "Falta DB_HOST"; exit 1; }
          [[ -n "${DB_USER}" ]]                      || { echo "Falta DB_USER"; exit 1; }
          [[ -n "${DB_PASSWORD}" ]]                  || { echo "Falta DB_PASSWORD"; exit 1; }
          [[ -n "${GOOGLE_DRIVE_CREDENTIALS_B64}" ]] || { echo "Falta GOOGLE_DRIVE_CREDENTIALS_B64"; exit 1; }
          [[ -n "${GOOGLE_DRIVE_FOLDER_ID}" ]]       || { echo "Falta GOOGLE_DRIVE_FOLDER_ID"; exit 1; }
          [[ -n "${YOUTUBE_API_KEY}" ]]               || { echo "Falta YOUTUBE_API_KEY"; exit 1; }

      # ── INGESTA YouTube (extracción, sin procesamiento) ──────────────────────
      - name: "[1/6] YouTube — Extraer comentarios"
        id: yt_extract
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python Medios/youtube_extract_hate.py
        continue-on-error: true

      # ── INGESTA X (sincronización + consolidación) ────────────────────────────
      - name: "[2/6] X — Sincronizar Drive"
        id: x_sync
        if: ${{ env.GOOGLE_DRIVE_CREDENTIALS != '' }}
        run: python X_Mensajes/sync_drive_csvs.py
        continue-on-error: true

      - name: "[3/6] X — Consolidar CSVs"
        id: x_consolidate
        run: python X_Mensajes/consolidar_csv.py
        continue-on-error: true

      # ── PIPELINE UNIFICADO (orquestador reemplaza steps legacy de procesamiento) ──
      # Reemplaza: filter_and_anonymize_x.py, X_terms_sheet.py, score_baseline.py,
      #            scored_prioridad_alta.py, tag_youtube_hate_auto.py
      - name: "[4/6] Pipeline unificado X"
        id: orch_x
        run: |
          python3 pipeline_unificado/orchestrator.py \
            --platform x \
            --input-file X_Mensajes/data/master/reto_x_master.csv \
            --out-dir outputs/pipeline_unificado/x \
            --terms-files Medios/hate_general_terms.csv Medios/hate_terms_clean.csv \
            --vectorizer Etiquetado_Modelos/vectorizer.joblib \
            --model-path Etiquetado_Modelos/model.joblib
        continue-on-error: true

      - name: "[5/6] Pipeline unificado YouTube"
        id: orch_yt
        run: |
          python3 pipeline_unificado/orchestrator.py \
            --platform youtube \
            --input-file Medios/youtube_hatemedia_comments_30d.csv \
            --out-dir outputs/pipeline_unificado/youtube \
            --terms-files Medios/hate_general_terms.csv Medios/hate_terms_clean.csv
        continue-on-error: true

      # ── Carga única a BD (lee outputs del orquestador) ───────────────────────
      - name: "[6/6] Cargar a PostgreSQL (YouTube + X)"
        id: load_db
        run: python automatizacion_diaria/load_to_db.py
        continue-on-error: true

      # ── Análisis semanal (solo lunes, hora España) ───────────────────────────
      - name: "[10] Análisis contextual semanal (solo lunes)"
        if: ${{ success() || steps.load_db.outcome == 'success' }}
        run: |
          DOW=$(TZ=Europe/Madrid date +%u)
          if [ "$DOW" -eq 1 ]; then
            echo "Lunes (Europe/Madrid): ejecutando analisis_contexto_semanal.py"
            python automatizacion_diaria/analisis_contexto_semanal.py
          else
            echo "No es lunes en España (dow=$DOW) — análisis semanal omitido."
          fi
        continue-on-error: true

      # ── Validación de etapas críticas ────────────────────────────────────────
      - name: Guardar caché de estado (siempre, incluso si healthcheck falla)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            Medios/ML/etiquetado_llm/outputs
            Medios/youtube_extract_state.json
            Medios/youtube_hatemedia_comments_30d.csv
            X_Mensajes/data/raw/.drive_sync_state.json
            X_Mensajes/data/raw/*.csv
            X_Mensajes/data/master/*.csv
            outputs/pipeline_unificado
          key: reto-pipeline-data-${{ github.run_number }}

      - name: Validar etapas críticas
        id: critical_gate
        if: always()
        run: |
          set -euo pipefail
          echo "Resultados por etapa:"
          echo "  yt_extract=${{ steps.yt_extract.outcome }}"
          echo "  x_sync=${{ steps.x_sync.outcome }}"
          echo "  x_consolidate=${{ steps.x_consolidate.outcome }}"
          echo "  orch_x=${{ steps.orch_x.outcome }}"
          echo "  orch_yt=${{ steps.orch_yt.outcome }}"
          echo "  load_db=${{ steps.load_db.outcome }}"

          critical_errors=0
          # load_db es la etapa más crítica — si falla, nada llegó a la BD
          [[ "${{ steps.load_db.outcome }}" == "success" ]] \
            || { echo "ERROR CRÍTICO: load_db falló — BD no actualizada"; critical_errors=$((critical_errors+1)); }
          [[ "${{ steps.x_consolidate.outcome }}" == "success" ]] \
            || { echo "ERROR: x_consolidate falló"; critical_errors=$((critical_errors+1)); }
          [[ "${{ steps.yt_extract.outcome }}" == "success" || "${{ steps.yt_extract.outcome }}" == "skipped" ]] \
            || { echo "ERROR: yt_extract falló"; critical_errors=$((critical_errors+1)); }
          [[ "${{ steps.orch_x.outcome }}" == "success" ]] \
            || { echo "ERROR: orch_x falló — X no procesada"; critical_errors=$((critical_errors+1)); }
          [[ "${{ steps.orch_yt.outcome }}" == "success" ]] \
            || { echo "ERROR: orch_yt falló — YouTube no procesada"; critical_errors=$((critical_errors+1)); }

          if [[ "$critical_errors" -gt 0 ]]; then
            echo "Fallaron $critical_errors etapas críticas — el workflow se marca como fallido."
            exit 1
          fi
          echo "Todas las etapas críticas OK."

      # ── Healthcheck operativo (siempre, incluso si falló algo) ───────────────
      - name: Healthcheck operativo por plataforma
        if: always()
        env:
          STAGE_X_SYNC:        ${{ steps.x_sync.outcome }}
          STAGE_X_CONSOLIDATE: ${{ steps.x_consolidate.outcome }}
          STAGE_YT_EXTRACT:    ${{ steps.yt_extract.outcome }}
          STAGE_ORCH_X:        ${{ steps.orch_x.outcome }}
          STAGE_ORCH_YT:       ${{ steps.orch_yt.outcome }}
          STAGE_LOAD_DB:       ${{ steps.load_db.outcome }}
        run: |
          python automatizacion_diaria/healthcheck_pipeline.py \
            --run-id "${{ github.run_id }}" \
            --run-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # ── Resumen final en el log ───────────────────────────────────────────────
      - name: Resumen del pipeline
        if: always()
        run: |
          echo "================================================"
          echo "RESUMEN PIPELINE RETO — $(TZ=Europe/Madrid date)"
          echo "================================================"
          echo "Run ID:       ${{ github.run_id }}"
          echo "Trigger:      ${{ github.event_name }}"
          echo "Estado final: ${{ job.status }}"
          echo ""
          echo "Etapas:"
          echo "  [1] yt_extract:    ${{ steps.yt_extract.outcome }}"
          echo "  [2] x_sync:        ${{ steps.x_sync.outcome }}"
          echo "  [3] x_consolidate: ${{ steps.x_consolidate.outcome }}"
          echo "  [4] orch_x:        ${{ steps.orch_x.outcome }}"
          echo "  [5] orch_yt:       ${{ steps.orch_yt.outcome }}"
          echo "  [6] load_db:       ${{ steps.load_db.outcome }}"
          echo "================================================"
